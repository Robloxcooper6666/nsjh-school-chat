<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南勢國中即時看板 | 升級版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        /* 模式與主題背景 */
        body.gay-power-active {
            background-image: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)), url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYVjwWcucjURU7AiWxIaK5KkqLDSH9zgO9gg&s');
        }
        body.mode-67-active {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://bubuu.com.tw/wp-content/uploads/2025/12/nnyy-71-1024x538.png');
            color: #f1f5f9;
        }
        body.theme-dark { background-color: #0f172a; color: #f1f5f9; }
        body.theme-sakura { background-color: #fff1f2; color: #881337; }
        body.theme-mint { background-color: #f0fdf4; color: #14532d; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        body.mode-67-active .glass-nav, body.theme-dark .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .post-card {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cat-btn {
            white-space: nowrap;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
            background: white;
            border: 1px solid #e2e8f0;
        }

        .active-cat {
            background-color: #3b82f6 !important;
            color: white !important;
            border-color: #3b82f6 !important;
            transform: scale(1.05);
        }

        /* 萬能開關 */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3b82f6; }
        #gay-power-toggle:checked + .slider { background: linear-gradient(90deg, #ff4d4d, #f9cb28, #32ff7e, #18dcff, #7d5fff); }
        #mode-67-toggle:checked + .slider { background-color: #f97316; }
        input:checked + .slider:before { transform: translateX(18px); }

        .rainbow-btn {
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6);
            background-size: 200% 100%;
            animation: rainbowFlow 3s linear infinite;
        }
        @keyframes rainbowFlow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .like-btn.active { color: #ef4444; transform: scale(1.2); }

        /* 捲軸隱藏 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- 導航欄 -->
    <nav class="glass-nav sticky top-0 z-50 px-4 py-3">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div onclick="handleAdminTrigger()" class="cursor-pointer">
                <h1 class="font-black text-xl flex items-center gap-2">
                    <span class="text-blue-500">NSJH</span> 即時看板
                </h1>
                <div class="flex items-center gap-1">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span id="status-text" class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Connecting</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="bg-blue-50 px-3 py-1 rounded-full border border-blue-100">
                    <p id="online-counter" class="text-[10px] font-black text-blue-600">偵測中</p>
                </div>
            </div>
        </div>
    </nav>

    <!-- 管理區 -->
    <div id="admin-area" class="hidden max-w-xl mx-auto px-4 mt-4">
        <div class="bg-slate-900 text-white p-5 rounded-3xl border-2 border-amber-500/50 shadow-2xl">
            <h3 class="text-amber-400 font-bold mb-3 flex items-center gap-2">🛠️ 管理員模式</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="clearLocalHistory()" class="bg-red-500/20 text-red-400 py-2 rounded-xl text-xs font-bold">清空本地快取</button>
                <button onclick="location.reload()" class="bg-slate-700 py-2 rounded-xl text-xs font-bold">登出</button>
            </div>
        </div>
    </div>

    <!-- 主頁面內容 -->
    <main class="max-w-xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- 主題選擇器 -->
        <section class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="setTheme('default')" class="cat-btn bg-white">🌕 預設</button>
            <button onclick="setTheme('dark')" class="cat-btn bg-slate-800 text-white border-none">🌑 深夜</button>
            <button onclick="setTheme('sakura')" class="cat-btn bg-pink-100 text-pink-600 border-none">🌸 櫻花</button>
            <button onclick="setTheme('mint')" class="cat-btn bg-emerald-100 text-emerald-600 border-none">🌿 薄荷</button>
        </section>

        <!-- 發布框 -->
        <div id="publish-box" class="bg-white rounded-[2rem] p-6 shadow-xl border border-slate-100 transition-all">
            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-5" id="cat-tabs">
                <button onclick="setCategory(this, '🌿 生活')" class="cat-btn active-cat">🌿 生活</button>
                <button onclick="setCategory(this, '💖 告白')" class="cat-btn">💖 告白</button>
                <button onclick="setCategory(this, '📚 課業')" class="cat-btn">📚 課業</button>
                <button onclick="setCategory(this, '🤫 秘密')" class="cat-btn">🤫 秘密</button>
                <button onclick="setCategory(this, '🌈 多元')" class="cat-btn">🌈 多元</button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="flex items-center justify-between px-3 py-2 bg-slate-50 rounded-2xl">
                    <span class="text-[10px] font-black text-slate-500 uppercase">Gay Power</span>
                    <label class="switch">
                        <input type="checkbox" id="gay-power-toggle" onchange="handleManualModeToggle()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="flex items-center justify-between px-3 py-2 bg-slate-50 rounded-2xl">
                    <span class="text-[10px] font-black text-slate-500 uppercase">67 模式</span>
                    <label class="switch">
                        <input type="checkbox" id="mode-67-toggle" onchange="handleManualModeToggle()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <input type="text" id="input-class" placeholder="班級" class="col-span-1 px-4 py-3 bg-slate-50 rounded-xl outline-none focus:ring-2 ring-blue-500/20 text-sm font-bold">
                <input type="text" id="input-name" placeholder="稱呼" class="col-span-2 px-4 py-3 bg-slate-50 rounded-xl outline-none focus:ring-2 ring-blue-500/20 text-sm font-bold">
            </div>

            <textarea id="input-content" rows="3" placeholder="說點什麼..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500/20 mb-4 text-sm resize-none"></textarea>

            <button id="send-btn" onclick="broadcast()" class="w-full rainbow-btn text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                ✨ 發送即時動態 ✨
            </button>
        </div>

        <!-- 訊息列表 -->
        <div id="message-list" class="space-y-4">
            <!-- 訊息將在此處動態生成 -->
        </div>
    </main>

    <script>
        const ABLY_KEY = '2eR4lg.LsxDLQ:um2A4_AugjiGw4kjkgAuw56q7AAGGTJa_rAHv0fk7UA';
        const HISTORY_KEY = 'nsjh_v8_history';
        const USER_KEY = 'nsjh_user_pref';
        
        const myId = 'NS-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: myId });
        const channel = ably.channels.get('nsjh-main-v8');

        let currentCat = '🌿 生活';
        let currentTheme = 'default';
        let adminClickCount = 0;
        let modeTimer = null;

        // --- 初始化與連線 ---
        ably.connection.on('connected', () => {
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-green-500 animate-pulse";
            document.getElementById('status-text').innerText = "Live";
            channel.presence.enter();
        });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (!err) document.getElementById('online-counter').innerText = `${members.length} 人在線`;
            });
        });

        // --- 核心邏輯 ---
        function setTheme(theme) {
            document.body.className = 'min-h-screen pb-20';
            if (theme !== 'default') document.body.classList.add(`theme-${theme}`);
            currentTheme = theme;
            updateVisualState();
        }

        function setCategory(btn, cat) {
            document.querySelectorAll('#cat-tabs button').forEach(b => b.classList.remove('active-cat'));
            btn.classList.add('active-cat');
            currentCat = cat;
            updateVisualState();
        }

        function handleManualModeToggle() {
            updateVisualState();
            if (document.getElementById('gay-power-toggle').checked || document.getElementById('mode-67-toggle').checked) {
                startModeTimer();
            }
        }

        function startModeTimer() {
            if (modeTimer) clearTimeout(modeTimer);
            modeTimer = setTimeout(() => {
                document.getElementById('gay-power-toggle').checked = false;
                document.getElementById('mode-67-toggle').checked = false;
                updateVisualState();
            }, 5000);
        }

        function updateVisualState() {
            const is67 = document.getElementById('mode-67-toggle').checked;
            const isGP = document.getElementById('gay-power-toggle').checked || currentCat === '🌈 多元';
            
            document.body.classList.toggle('mode-67-active', is67);
            document.body.classList.toggle('gay-power-active', isGP);

            const box = document.getElementById('publish-box');
            if (is67) {
                box.style.backgroundColor = '#1e293b';
                box.style.borderColor = '#f97316';
            } else if (currentTheme === 'dark') {
                box.style.backgroundColor = '#1e293b';
                box.style.borderColor = '#334155';
            } else {
                box.style.backgroundColor = '';
                box.style.borderColor = '';
            }
        }

        function broadcast() {
            const cls = document.getElementById('input-class').value.trim();
            const name = document.getElementById('input-name').value.trim();
            const content = document.getElementById('input-content').value.trim();
            
            if (!cls || !name || !content) return;

            const payload = {
                id: 'MID-' + Date.now(),
                cls, name, content,
                cat: currentCat,
                isGP: document.getElementById('gay-power-toggle').checked,
                is67: document.getElementById('mode-67-toggle').checked,
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
            };

            channel.publish('msg', payload, (err) => {
                if (!err) {
                    document.getElementById('input-content').value = '';
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    localStorage.setItem(USER_KEY, JSON.stringify({cls, name}));
                }
            });
        }

        channel.subscribe('msg', (m) => {
            const data = m.data;
            if (data.is67) document.getElementById('mode-67-toggle').checked = true;
            if (data.isGP) document.getElementById('gay-power-toggle').checked = true;
            
            if (data.is67 || data.isGP) {
                updateVisualState();
                startModeTimer();
            }

            renderMessage(data);
            saveHistory(data);
        });

        function renderMessage(data) {
            if (document.getElementById(data.id)) return;
            const list = document.getElementById('message-list');
            const el = document.createElement('div');
            el.id = data.id;
            
            const is67 = data.is67;
            const isRainbow = data.isGP || data.cat === '🌈 多元';

            let cardStyles = "post-card p-5 rounded-[2rem] shadow-md border relative overflow-hidden ";
            if (is67) cardStyles += "bg-slate-900 border-orange-500 text-white";
            else if (isRainbow) cardStyles += "bg-white border-pink-200";
            else cardStyles += "bg-white border-slate-100";

            el.className = cardStyles;
            el.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${is67 ? 'bg-orange-500/20 text-orange-400' : 'bg-blue-50 text-blue-500'}">
                        ${data.cat}
                    </span>
                    <span class="text-[10px] opacity-40 font-bold">${data.time}</span>
                </div>
                <p class="text-sm font-medium mb-4 leading-relaxed">${escape(data.content)}</p>
                <div class="flex justify-between items-center pt-3 border-t ${is67 ? 'border-slate-800' : 'border-slate-50'}">
                    <div class="text-[10px] font-bold opacity-60">
                        ${escape(data.cls)} · ${escape(data.name)}
                    </div>
                    <div class="flex gap-3">
                        <button onclick="toggleLike('${data.id}')" id="like-${data.id}" class="like-btn text-sm hover:scale-110 transition-transform">❤️</button>
                        <button onclick="report('${data.id}')" class="opacity-20 hover:opacity-100 text-xs">🚩</button>
                    </div>
                </div>
                ${isRainbow ? '<div class="absolute top-0 left-0 w-full h-1 rainbow-btn"></div>' : ''}
            `;
            list.insertBefore(el, list.firstChild);
        }

        // --- 互動功能 ---
        function toggleLike(id) {
            const btn = document.getElementById(`like-${id}`);
            btn.classList.toggle('active');
            if (btn.classList.contains('active')) {
                confetti({ particleCount: 30, spread: 50, colors: ['#ff0000', '#ff6666'] });
            }
        }

        function report(id) {
            if(confirm("確定要檢舉這則訊息嗎？")) {
                alert("檢舉已收到，管理員將進行審核。");
                document.getElementById(id).style.opacity = '0.5';
            }
        }

        function handleAdminTrigger() {
            adminClickCount++;
            if (adminClickCount >= 5) {
                if (prompt("輸入密碼：") === "123") {
                    document.getElementById('admin-area').classList.remove('hidden');
                }
                adminClickCount = 0;
            }
        }

        // --- 輔助功能 ---
        function escape(s) {
            let d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function saveHistory(data) {
            let h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            if (!h.find(i => i.id === data.id)) {
                h.push(data);
                if (h.length > 50) h.shift();
                localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
            }
        }

        function clearLocalHistory() {
            localStorage.removeItem(HISTORY_KEY);
            location.reload();
        }

        window.onload = () => {
            const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            h.forEach(renderMessage);
            const u = JSON.parse(localStorage.getItem(USER_KEY) || '{}');
            if (u.cls) document.getElementById('input-class').value = u.cls;
            if (u.name) document.getElementById('input-name').value = u.name;
        };
    </script>
</body>
</html>
