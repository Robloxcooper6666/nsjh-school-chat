<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南勢國中即時看板 | LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        /* Gay Power 模式背景 */
        body.gay-power-active {
            background-image: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)), url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYVjwWcucjURU7AiWxIaK5KkqLDSH9zgO9gg&s');
        }

        /* 67 模式背景 */
        body.mode-67-active {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://bubuu.com.tw/wp-content/uploads/2025/12/nnyy-71-1024x538.png');
            background-attachment: fixed;
            background-size: cover;
            color: #f1f5f9;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        body.mode-67-active .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            border-bottom-color: rgba(255,255,255,0.1);
        }

        body.mode-67-active h1 { color: white; }

        .post-card {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cat-btn {
            white-space: nowrap;
            padding: 0.625rem 1.25rem;
            border-radius: 1rem;
            border: 2px solid #f1f5f9;
            font-size: 0.75rem;
            font-weight: 900;
            color: #64748b;
            transition: all 0.2s;
            background: white;
        }

        .active-cat {
            background-color: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
        }

        /* 通用開關樣式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        #gay-power-toggle:checked + .slider {
            background: linear-gradient(90deg, #ff4d4d, #f9cb28, #32ff7e, #18dcff, #7d5fff);
        }

        #mode-67-toggle:checked + .slider {
            background-color: #f97316;
            box-shadow: 0 0 8px #f97316;
        }

        .switch input:checked + .slider:before {
            transform: translateX(20px);
        }

        .rainbow-btn {
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6);
            background-size: 200% 100%;
            animation: rainbowFlow 4s linear infinite;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .rainbow-card-border {
            border: 2px solid;
            border-image: linear-gradient(to right, #ff4d4d, #f9cb28, #32ff7e, #18dcff, #7d5fff) 1;
        }

        .mode-67-card {
            border: 2px solid #f97316 !important;
            background: rgba(30, 41, 59, 0.95) !important;
            color: #f1f5f9 !important;
        }
        .mode-67-card p { color: #f1f5f9 !important; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        #admin-area { display: none; }

        .status-dot-online {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <nav class="glass-nav sticky top-0 z-40 border-b border-slate-200/60 px-4 py-3 mb-6">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex flex-col" onclick="handleAdminTrigger()">
                <h1 class="font-black text-xl tracking-tight leading-tight cursor-pointer select-none">
                    南勢國中 <span class="text-blue-600">即時看板</span>
                </h1>
                <div id="status-container" class="flex items-center gap-1.5 mt-0.5">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span id="status-text" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest transition-colors">Connecting</span>
                </div>
            </div>

            <div class="bg-blue-50 px-3 py-1.5 rounded-2xl border border-blue-100">
                <p id="online-counter" class="text-[11px] font-black text-blue-600">偵測中...</p>
            </div>
        </div>
    </nav>

    <div id="admin-area" class="max-w-xl mx-auto px-4 mb-8">
        <div class="bg-slate-900 text-white p-6 rounded-[2rem] shadow-2xl border-4 border-slate-800">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-amber-400">管理控制台</h2>
                <button onclick="location.reload()" class="text-xs bg-white/10 px-3 py-1 rounded-full">登出</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">連線數</p>
                    <p id="admin-conn-count" class="text-2xl font-black text-blue-400">0</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="clearLocalHistory()" class="text-[10px] bg-red-500/20 text-red-400 p-2 rounded-xl font-bold">🗑️ 清除快取</button>
                    <button onclick="exportHistory()" class="text-[10px] bg-green-500/20 text-green-400 p-2 rounded-xl font-bold">📥 匯出資料</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 發表動態 -->
    <section class="max-w-xl mx-auto px-4 mb-8">
        <div id="publish-box" class="bg-white/90 backdrop-blur-sm rounded-[2.5rem] p-6 shadow-xl border border-white transition-colors duration-500">
            <!-- 分類選單 -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4" id="cat-tabs">
                <button onclick="setCategory(this, '🌿 生活')" class="cat-btn active-cat">🌿 生活</button>
                <button onclick="setCategory(this, '💖 告白')" class="cat-btn">💖 告白</button>
                <button onclick="setCategory(this, '📚 課業')" class="cat-btn">📚 課業</button>
                <button onclick="setCategory(this, '🤫 秘密')" class="cat-btn">🤫 秘密</button>
                <button onclick="setCategory(this, '🌈 多元')" class="cat-btn">🌈 多元</button>
            </div>

            <!-- 控制面板 -->
            <div class="grid grid-cols-2 gap-2 mb-6">
                <div class="flex items-center justify-between px-3 py-2 bg-slate-50/50 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-2">
                        <span class="text-sm">🌈</span>
                        <span class="text-[10px] font-black text-slate-600">Gay Power</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="gay-power-toggle" onchange="handleManualModeToggle()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="flex items-center justify-between px-3 py-2 bg-slate-50/50 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-2">
                        <span class="text-sm">🔥</span>
                        <span class="text-[10px] font-black text-slate-600">67 模式</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="mode-67-toggle" onchange="handleManualModeToggle()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-3">
                <input type="text" id="input-class" placeholder="班級" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500/20 font-bold text-sm border border-slate-100 transition-all text-slate-800">
                <input type="text" id="input-name" placeholder="稱呼" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-blue-500/20 font-bold text-sm border border-slate-100 transition-all text-slate-800">
            </div>

            <textarea id="input-content" rows="3" placeholder="想對大家說點什麼嗎？" class="w-full p-5 bg-slate-50 rounded-3xl outline-none focus:ring-2 ring-blue-500/20 mb-4 text-sm font-medium border border-slate-100 resize-none transition-all text-slate-800"></textarea>

            <button id="send-btn" onclick="broadcast()" class="w-full rainbow-btn text-white font-black py-4.5 rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 group">
                <span class="group-hover:scale-105 transition-transform">✨ 散播正能量 ✨</span>
            </button>
        </div>
    </section>

    <!-- 訊息牆 -->
    <main id="message-list" class="max-w-xl mx-auto px-4 space-y-4">
        <!-- 動態載入 -->
    </main>

    <div class="fixed bottom-6 right-6 flex flex-col gap-3 items-end">
        <a href="https://robloxcooper6666.github.io/nsjh-school-chat/help.html" target="_blank"
           class="bg-slate-900 text-white px-5 py-3 rounded-full shadow-2xl font-bold text-sm hover:scale-105 transition-all active:scale-90 border border-white/20">
            ❓ 幫助中心
        </a>
    </div>

    <script>
        const ABLY_KEY = '2eR4lg.LsxDLQ:um2A4_AugjiGw4kjkgAuw56q7AAGGTJa_rAHv0fk7UA';
        const ADMIN_PWD = '123';
        const HISTORY_KEY = 'nsjh_chat_history_v7';
        const USER_KEY = 'nsjh_user';

        const myId = 'NS-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: myId });
        const channel = ably.channels.get('nsjh-main-v7');

        let currentCat = '🌿 生活';
        let secretCounter = 0;
        let modeTimer = null; // 用於計時自動關閉模式

        function handleAdminTrigger() {
            secretCounter++;
            if (secretCounter >= 5) {
                const pass = prompt("系統模式切換：");
                if (pass === ADMIN_PWD) {
                    document.getElementById('admin-area').style.display = 'block';
                    document.getElementById('admin-area').scrollIntoView({ behavior: 'smooth' });
                }
                secretCounter = 0;
            }
        }

        ably.connection.on('connected', () => {
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full status-dot-online animate-pulse";
            document.getElementById('status-text').innerText = "Live Connected";
            channel.presence.enter();
        });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (err) return;
                document.getElementById('online-counter').innerText = `目前在線 ${members.length} 位同學`;
                if(document.getElementById('admin-area').style.display === 'block') {
                    document.getElementById('admin-conn-count').innerText = members.length;
                }
            });
        });

        channel.subscribe('msg', (message) => {
            const data = message.data;
            
            // 重要：如果是新收到的訊息，且有勾選模式，讓接收者也自動切換模式
            syncRemoteMode(data);
            
            displayMessage(data);
            saveToLocal(data);
        });

        // 核心功能：接收到訊息時同步背景模式，並於 5 秒後關閉
        function syncRemoteMode(data) {
            let modeTriggered = false;

            if (data.is67) {
                document.getElementById('mode-67-toggle').checked = true;
                modeTriggered = true;
            }

            if (data.isGayPower || data.cat === '🌈 多元') {
                document.getElementById('gay-power-toggle').checked = true;
                modeTriggered = true;
            }

            if (modeTriggered) {
                updateVisualMode();
                startModeTimer(); // 啟動 5 秒計時器
            }
        }

        // 手動切換開關時也啟動計時
        function handleManualModeToggle() {
            updateVisualMode();
            const isGayPower = document.getElementById('gay-power-toggle').checked;
            const is67Mode = document.getElementById('mode-67-toggle').checked;
            
            if (isGayPower || is67Mode) {
                startModeTimer();
            }
        }

        // 啟動 5 秒後自動關閉的計時器
        function startModeTimer() {
            if (modeTimer) clearTimeout(modeTimer);
            modeTimer = setTimeout(() => {
                document.getElementById('gay-power-toggle').checked = false;
                document.getElementById('mode-67-toggle').checked = false;
                updateVisualMode();
                modeTimer = null;
            }, 5000); // 5000 毫秒 = 5 秒
        }

        function broadcast() {
            const cls = document.getElementById('input-class').value.trim();
            const name = document.getElementById('input-name').value.trim();
            const content = document.getElementById('input-content').value.trim();
            if (!cls || !name || !content) return;

            const isGP = document.getElementById('gay-power-toggle').checked;
            const is67 = document.getElementById('mode-67-toggle').checked;

            const payload = {
                id: 'M-' + Date.now() + Math.random().toString(36).substr(2, 4),
                cat: currentCat,
                cls: cls,
                name: name,
                content: content,
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                isGayPower: isGP,
                is67: is67
            };

            const btn = document.getElementById('send-btn');
            btn.disabled = true;
            channel.publish('msg', payload, (err) => {
                btn.disabled = false;
                if (!err) {
                    document.getElementById('input-content').value = '';
                    localStorage.setItem(USER_KEY, JSON.stringify({cls, name}));
                    
                    // 發送後自己也會觸發 5 秒關閉
                    if (isGP || is67) startModeTimer();
                }
            });
        }

        function displayMessage(data) {
            if(document.getElementById('msg-' + data.id)) return;
            const list = document.getElementById('message-list');
            const item = document.createElement('div');
            item.id = `msg-${data.id}`;

            const isRainbow = data.cat === '🌈 多元' || data.isGayPower;
            const is67 = data.is67 === true;

            let cardClass = `post-card p-6 rounded-[2rem] shadow-sm border flex flex-col `;
            if (is67) {
                cardClass += 'mode-67-card';
            } else if (isRainbow) {
                cardClass += 'bg-white/95 rainbow-card-border';
            } else {
                cardClass += 'bg-white/95 border-slate-100';
            }

            item.className = cardClass;
            item.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-black ${is67 ? 'text-orange-400 bg-orange-400/10' : (isRainbow ? 'text-pink-500 bg-pink-50' : 'text-blue-600 bg-blue-50')} tracking-widest uppercase px-3 py-1 rounded-full border border-current opacity-80">
                        ${is67 ? '🔥 67 模式' : (data.isGayPower && data.cat !== '🌈 多元' ? '🌈 Gay Power' : data.cat)}
                    </span>
                    <span class="text-[10px] font-bold text-slate-300">${data.time}</span>
                </div>
                <p class="font-medium text-base mb-5 leading-relaxed break-words ${is67 ? 'text-slate-100' : 'text-slate-800'}">${escapeHtml(data.content)}</p>
                <div class="text-[11px] font-bold flex items-center gap-2 border-t pt-4 ${is67 ? 'text-slate-400 border-slate-700' : 'text-slate-400 border-slate-50'}">
                    <span class="w-1.5 h-1.5 rounded-full ${is67 ? 'bg-orange-500' : 'bg-slate-200'}"></span>
                    <span>${escapeHtml(data.cls)}</span>
                    <span class="opacity-30">|</span>
                    <span>${escapeHtml(data.name)}</span>
                </div>
            `;
            list.insertBefore(item, list.firstChild);
        }

        function updateVisualMode() {
            const isGayPower = document.getElementById('gay-power-toggle').checked;
            const is67Mode = document.getElementById('mode-67-toggle').checked;
            const publishBox = document.getElementById('publish-box');

            if (is67Mode) {
                document.body.classList.add('mode-67-active');
                publishBox.style.backgroundColor = 'rgba(15, 23, 42, 0.9)';
                publishBox.style.borderColor = '#f97316';
            } else {
                document.body.classList.remove('mode-67-active');
                publishBox.style.backgroundColor = '';
                publishBox.style.borderColor = '';
            }

            if (isGayPower || currentCat === '🌈 多元') {
                document.body.classList.add('gay-power-active');
            } else {
                document.body.classList.remove('gay-power-active');
            }
        }

        function setCategory(btn, name) {
            document.querySelectorAll('#cat-tabs button').forEach(b => b.classList.remove('active-cat'));
            btn.classList.add('active-cat');
            currentCat = name;
            updateVisualMode();
        }

        function saveToLocal(data) {
            let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            if(history.find(h => h.id === data.id)) return;
            history.push(data);
            if(history.length > 50) history.shift();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function clearLocalHistory() {
            if(confirm("確定要清除手機本地的快取紀錄嗎？")) {
                localStorage.removeItem(HISTORY_KEY);
                location.reload();
            }
        }

        function exportHistory() {
            const data = localStorage.getItem(HISTORY_KEY);
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup-${Date.now()}.json`;
            a.click();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onload = () => {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history.forEach(displayMessage);
            const user = JSON.parse(localStorage.getItem(USER_KEY) || '{}');
            if(user.cls) document.getElementById('input-class').value = user.cls;
            if(user.name) document.getElementById('input-name').value = user.name;
        };
    </script>
</body>
</html>
